<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foundations path mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --night:#101028; --deep:#0b0b1e; --ink:#17173a; --line:rgba(190,185,255,.14);
  --text:#ecebff; --soft:#a9a6d6; --faint:#6f6c9c;
  --amber:#ffb561; --aqua:#7df0df; --lav:#b9a5ff; --rose:#ff7a90;
  --display:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;
  --ui:'Instrument Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--night);color:var(--text);font-family:var(--ui);font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--aqua);outline-offset:3px;border-radius:8px}
canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block;transition:filter .7s var(--ease)}
body.focus canvas#scene{filter:blur(18px) brightness(.45) saturate(.8)}

/* ── path view chrome ── */
.hud{position:fixed;inset:0;pointer-events:none;transition:opacity .45s var(--ease),transform .6s var(--ease)}
.hud>*{pointer-events:auto}
body.focus .hud{opacity:0;transform:scale(1.04);pointer-events:none}
body.focus .hud>*{pointer-events:none}

.seg{position:absolute;top:22px;left:26px;display:flex;background:rgba(255,255,255,.06);border-radius:999px;padding:4px;backdrop-filter:blur(10px)}
.seg button{position:relative;z-index:1;padding:7px 16px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--soft);transition:color .3s}
.seg button.on{color:var(--deep)}
.seg .pill,.dock .pill,.tabs .pill{position:absolute;top:4px;bottom:4px;left:0;border-radius:999px;background:var(--text);transition:transform .45s var(--ease),width .45s var(--ease)}

.stage-title{position:absolute;left:28px;top:84px;max-width:min(560px,80vw)}
.stage-title h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,5vw,62px);line-height:1.02;letter-spacing:-.02em}
.stage-title p{margin-top:12px;color:var(--soft);font-size:15px}
.stage-title .swap{transition:opacity .3s,transform .5s var(--ease)}
.stage-title .swap.out{opacity:0;transform:translateY(10px)}

.top-right{position:absolute;top:22px;right:26px;display:flex;gap:12px;align-items:center}
.redo-chip{display:flex;gap:8px;align-items:center;padding:8px 14px;border-radius:999px;background:rgba(185,165,255,.14);color:var(--lav);font-size:13.5px;font-weight:500;transition:background .25s,transform .25s var(--ease)}
.redo-chip:hover{background:rgba(185,165,255,.24);transform:translateY(-1px)}
.redo-chip i{width:8px;height:8px;border-radius:50%;border:2px solid var(--lav)}
.ring{position:relative;width:46px;height:46px}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.5}
.ring .bg{stroke:rgba(255,255,255,.1)}
.ring .fg{stroke:var(--amber);stroke-linecap:round;transition:stroke-dashoffset 1s var(--ease)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:600}

.dock{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);display:flex;background:rgba(255,255,255,.06);border-radius:999px;padding:4px;backdrop-filter:blur(10px);max-width:calc(100vw - 24px);overflow-x:auto}
.dock button{position:relative;z-index:1;padding:9px 18px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--soft);white-space:nowrap;transition:color .3s}
.dock button.on{color:var(--deep)}

.tip{position:fixed;left:0;top:0;pointer-events:none;padding:6px 11px;border-radius:9px;background:rgba(11,11,30,.85);font-size:13px;font-weight:500;white-space:nowrap;opacity:0;transition:opacity .15s;will-change:transform}
.tip.on{opacity:1}

.card{position:absolute;left:50%;bottom:92px;width:min(430px,calc(100vw - 32px));transform:translate(-50%,24px);opacity:0;pointer-events:none;
  background:rgba(23,23,58,.82);backdrop-filter:blur(16px);border-radius:22px;padding:20px 22px;display:flex;align-items:center;gap:18px;
  transition:opacity .35s,transform .55s var(--ease)}
.card.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.card .what{flex:1;min-width:0}
.card .what small{color:var(--soft);font-size:13px}
.card .what h2{font-family:var(--display);font-size:21px;font-weight:700;line-height:1.2;margin-top:3px}
.go{flex-shrink:0;padding:12px 20px;border-radius:999px;background:var(--aqua);color:var(--deep);font-weight:600;font-size:14.5px;transition:transform .25s var(--ease),box-shadow .25s}
.go:hover{transform:scale(1.05);box-shadow:0 0 28px rgba(125,240,223,.45)}
.go:active{transform:scale(.97)}

.note{position:absolute;left:26px;bottom:26px;font-size:12.5px;color:var(--faint);max-width:240px;line-height:1.5}

/* ── focus view ── */
.lesson{position:fixed;inset:0;display:grid;grid-template-columns:minmax(300px,410px) 1fr;opacity:0;pointer-events:none;transform:scale(.96);transition:opacity .4s,transform .7s var(--ease)}
body.focus .lesson{opacity:1;pointer-events:auto;transform:none;transition-delay:.15s}
.brief{padding:26px 30px 30px;display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.back{align-self:flex-start;display:flex;gap:8px;align-items:center;color:var(--soft);font-size:14px;padding:6px 10px 6px 4px;border-radius:999px;transition:color .2s,transform .3s var(--ease)}
.back:hover{color:var(--text);transform:translateX(-3px)}
.brief h2{font-family:var(--display);font-weight:700;font-size:clamp(30px,3.2vw,42px);line-height:1.05;letter-spacing:-.02em;margin-top:26px}
.brief .kind{color:var(--soft);font-size:14px;margin-top:10px}
.brief .task{margin-top:22px;font-size:16px;line-height:1.6;max-width:36ch}
.brief code{font-family:var(--mono);font-size:.86em;background:rgba(255,255,255,.08);padding:1px 6px;border-radius:6px}
.eg{margin-top:16px;font-family:var(--mono);font-size:13px;line-height:1.7;color:var(--soft);white-space:pre-wrap}
.eg b{color:var(--text);font-weight:500}
.tabs{position:relative;display:inline-flex;align-self:flex-start;margin-top:30px;background:rgba(255,255,255,.06);border-radius:999px;padding:4px}
.tabs button{position:relative;z-index:1;padding:7px 15px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--soft);transition:color .3s}
.tabs button.on{color:var(--deep)}
.tabbody{margin-top:16px;font-size:14.5px;line-height:1.65;color:var(--soft);max-width:38ch;transition:opacity .22s,transform .4s var(--ease)}
.tabbody.out{opacity:0;transform:translateY(8px)}
.tabbody p+p{margin-top:10px}
.tabbody strong{color:var(--text);font-weight:600}
.reveal{margin-top:12px;color:var(--aqua);font-weight:500;font-size:14px}
.locked{display:flex;gap:12px;align-items:center}
.tries{display:flex;gap:6px}
.tries i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.14);transition:background .3s}
.tries i.used{background:var(--rose)}

.desk{margin:14px 14px 14px 0;border-radius:26px;background:var(--deep);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.code{flex:1;min-height:0;overflow:auto;padding:24px 0;font-family:var(--mono);font-size:13.5px;line-height:1.7}
.ln{display:grid;grid-template-columns:52px 1fr;white-space:pre}
.ln>span:first-child{text-align:right;padding-right:18px;color:#45446e;user-select:none}
.ln>span:last-child{color:#d8d6f5;padding-right:20px}
.k{color:#b9a5ff}.t{color:#7df0df}.s{color:#ffb561}.c{color:#6f6c9c}
.caret{display:inline-block;width:2px;height:1.15em;background:var(--aqua);vertical-align:text-bottom;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.bar{position:relative;display:flex;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--line)}
.dots{display:flex;gap:9px;align-items:center}
.dot{width:16px;height:16px;border-radius:50%;transform:scale(0);transition:transform .5s var(--ease),box-shadow .3s}
.dot.in{transform:scale(1)}
.dot.pass{background:var(--amber)}
.dot.fail{background:var(--rose)}
.dot:hover,.dot.open{box-shadow:0 0 0 5px rgba(255,255,255,.12)}
.verdict{font-size:14px;color:var(--soft);opacity:0;transform:translateX(-6px);transition:opacity .3s,transform .5s var(--ease)}
.verdict.in{opacity:1;transform:none}
.verdict.win{color:var(--amber);font-weight:600}
.bar .sp{flex:1}
.btn{padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;transition:transform .25s var(--ease),background .25s,box-shadow .25s}
.btn:active{transform:scale(.96)}
.btn.quiet{background:rgba(255,255,255,.07);color:var(--text)}
.btn.quiet:hover{background:rgba(255,255,255,.13)}
.btn.main{background:var(--aqua);color:var(--deep);min-width:148px}
.btn.main:hover{box-shadow:0 0 26px rgba(125,240,223,.4);transform:translateY(-1px)}
.btn.main.busy{background:rgba(125,240,223,.35)}
.detail{position:absolute;left:18px;bottom:calc(100% + 10px);background:var(--ink);border-radius:16px;padding:14px 16px;font-family:var(--mono);font-size:12.5px;line-height:1.75;color:var(--soft);white-space:pre;opacity:0;transform:translateY(8px) scale(.97);transform-origin:left bottom;pointer-events:none;transition:opacity .2s,transform .4s var(--ease)}
.detail.on{opacity:1;transform:none}
.detail b{color:var(--text);font-weight:500}.detail u{color:var(--rose);text-decoration:none}

@media (max-width:820px){
  .lesson{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow-y:auto}
  .desk{margin:0 12px 12px;min-height:420px}
  .stage-title{top:78px}.note{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation:none!important}
}
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>

<div class="hud">
  <div class="seg" id="mode"><span class="pill"></span><button class="on">Foundations</button><button>Problems</button></div>
  <div class="stage-title"><div class="swap" id="stageSwap"><h1 id="stageName"></h1><p id="stageSub"></p></div></div>
  <div class="top-right">
    <button class="redo-chip" id="redoChip"><i></i>2 to write again</button>
    <div class="ring" title="Lessons finished"><svg width="46" height="46"><circle class="bg" cx="23" cy="23" r="19"/><circle class="fg" id="ringFg" cx="23" cy="23" r="19"/></svg><span id="ringTxt"></span></div>
  </div>
  <div class="card" id="card">
    <div class="what"><small id="cardKind"></small><h2 id="cardTitle"></h2></div>
    <button class="go" id="cardGo">Start coding</button>
  </div>
  <div class="dock" id="dock"><span class="pill"></span></div>
  <p class="note">Mockup. Try: Merge sort, Start coding, then press Check my code twice.</p>
</div>
<div class="tip" id="tip"></div>

<div class="lesson" id="lesson">
  <div class="brief">
    <button class="back" id="back">← Path</button>
    <h2 id="lTitle"></h2>
    <div class="kind" id="lKind"></div>
    <div class="task" id="lTask"></div>
    <div class="tabs" id="tabs"><span class="pill"></span><button data-t="refresher" class="on">Refresher</button><button data-t="hints">Hints</button><button data-t="answer">Answer</button></div>
    <div class="tabbody" id="tabBody"></div>
  </div>
  <div class="desk">
    <div class="code" id="code"></div>
    <div class="bar">
      <div class="detail" id="detail"></div>
      <div class="dots" id="dots"></div>
      <span class="verdict" id="verdict"></span>
      <span class="sp"></span>
      <button class="btn quiet">Run</button>
      <button class="btn main" id="check">Check my code</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
const $ = id => document.getElementById(id)

/* ── content ─────────────────────────────────────────────── */
const KIND = { program:'Write the whole program', implement:'Write the function', drill:'Quick drill', bugfix:'Find the bug' }
const P='program', I='implement', D='drill', B='bugfix'
const STAGES = [
  { short:'Warm-up', name:'C++ warm-up', layout:'row', lessons:[
    ['Sum of N numbers',P],['Read until the input ends',P],['Count the vowels',P],['Swap: value or reference',I],['Reverse a vector',I],['Is it a palindrome?',I],
    ['A struct of students',I],['Pointers and arrays',I],['Walk a 2D grid',I],['Print a number triangle',P],['The average is always 0',B],['The copy that never changed',B]]},
  { short:'Sort & search', name:'Sort and search by hand', layout:'stairs', lessons:[
    ['Bubble sort',I],['Selection sort',I],['Insertion sort',I],['Merge sort',I],['Quick sort',I],['Counting sort',I],['Binary search',I],['Lower and upper bound',I],['Binary search never ends',B],['Sort student records',P]]},
  { short:'Build it', name:'Build it yourself', layout:'tree', lessons:[
    ['Dynamic array',I],['Linked list',I],['Reverse a linked list',I],['Stack',I],['Circular queue',I],['Min-heap',I],['Hash map',I],['Binary search tree',I],['Delete from a BST',I],['Graph and BFS',I],['DFS',I],['Union-find',I]]},
  { short:'STL', name:'The standard library', layout:'grid', lessons:[
    ['vector basics',D],['sort with a lambda',D],['pair and tuple',D],['string tools',D],['set',D],['multiset',D],['map',D],['unordered_map',D],['stack and queue',D],['deque',D],['priority_queue',D],['priority_queue, your order',D],
    ['lower_bound',D],['Iterators',D],['Erase while looping',D],['accumulate and friends',D],['min and max element',D],['reverse and rotate',D],['unique',D],['next_permutation',D],['The iterator that went stale',B],['The comparator that crashes sort',B]]},
  { short:'Algorithms', name:'Algorithms', layout:'graph', lessons:[
    ['Subsets',I],['Permutations',I],['N-Queens',I],['Prefix sums',I],['2D prefix sums',I],['Two pointers',I],['Sliding window',I],['Binary search on the answer',I],['BFS on a grid',I],['Count components',I],['Cycle detection',I],
    ['Topological sort',I],['Dijkstra',I],['Bellman-Ford',I],['Kruskal',I],['Climbing stairs',I],['House robber',I],['Coin change',I],['0/1 knapsack',I],['Longest increasing subsequence',I],['Longest common subsequence',I],['Edit distance',I]]},
]
const DONE = 15            // first 15 lessons finished
const REDO = ['1.4','2.3']

const SAMPLES = {
  '2.4': {
    task:'Sort the vector in ascending order. <code>std::sort</code> is off the table.',
    refresher:'<p>Split the range in half and sort each half.</p><p>Then <strong>merge</strong>: two read pointers, always take the smaller front value, and copy whatever is left.</p><p>One element is already sorted.</p>',
    hints:['Write <code>merge</code> first and trace it on <code>[2 5 | 1 9]</code>.','Use half-open ranges <code>[lo, hi)</code> everywhere.','After the main loop, one half still has values in it.'],
    code:`void merge(vector<int>& a, int lo, int mid, int hi) {
    vector<int> tmp;
    int i = lo, j = mid;
    while (i < mid && j < hi) {
        if (a[i] <= a[j]) tmp.push_back(a[i++]);
        else tmp.push_back(a[j++]);
    }
    ▮
    for (int k = 0; k < (int)tmp.size(); k++) a[lo + k] = tmp[k];
}

void mergeSort(vector<int>& a, int lo, int hi) {
    if (hi - lo <= 1) return;
    int mid = lo + (hi - lo) / 2;
    mergeSort(a, lo, mid);
    mergeSort(a, mid, hi);
    merge(a, lo, mid, hi);
}`,
    fixed:`    while (i < mid) tmp.push_back(a[i++]);
    while (j < hi) tmp.push_back(a[j++]);`,
    fails:{2:'<b>input</b>     5 2 9 1\n<b>expected</b>  1 2 5 9\n<b>got</b>       <u>1 2 9 1</u>',4:'<b>input</b>     9 8 7 6 5\n<b>expected</b>  5 6 7 8 9\n<b>got</b>       <u>5 6 7 6 5</u>',5:'<b>input</b>     100 000 random values\n<b>got</b>       <u>not sorted</u>'},
    tests:6 },
  '1.1': {
    task:'Read <code>n</code>, then <code>n</code> integers. Print their sum.',
    eg:'<b>in</b>   4\n     10 20 30 40\n<b>out</b>  100',
    refresher:'<p>This file starts empty. You write the <code>#include</code> lines and <code>int main()</code>.</p><p><code>cin &gt;&gt; x</code> reads the next value. <code>cout &lt;&lt; x</code> prints it.</p><p>Big sums overflow <code>int</code>. Reach for <code>long long</code>.</p>',
    hints:['Get an empty <code>main</code> compiling before adding logic.','Look at the largest values the input allows.'],
    code:`#include <iostream>
using namespace std;

int main() {
    int n;
    cin >> n;
    ▮
}`, fails:{2:'<b>input</b>     3 values of 2000000000\n<b>expected</b>  6000000000\n<b>got</b>       <u>1705032704</u>'}, tests:3 },
  '4.12': {
    task:'Return task names in run order: lowest priority number first, ties by name. Use a <code>priority_queue</code>.',
    eg:'<b>in</b>   {2,deploy} {1,test} {2,build}\n<b>out</b>  test build deploy',
    refresher:'<p><code>priority_queue</code> puts the <strong>largest</strong> on top by default.</p><p>Its comparator answers "does <code>a</code> sit below <code>b</code>?", which reads backwards from <code>sort</code>.</p>',
    hints:['For a min-heap, return <code>a.priority &gt; b.priority</code>.','Handle the tie inside the same lambda.'],
    code:`struct Task { int priority; string name; };

vector<string> runOrder(vector<Task> tasks) {
    auto cmp = [](const Task& a, const Task& b) {
        ▮
    };
}`, fails:{1:'<b>expected</b>  test build deploy\n<b>got</b>       <u>deploy build test</u>'}, tests:4 },
}
const GENERIC = { task:'This lesson is a placeholder in the mockup. Merge sort, Sum of N numbers and "priority_queue, your order" are filled in.',
  refresher:'<p>Two or three lines to jog your memory live here.</p>', hints:['First nudge.','Second nudge.'], code:'▮', fails:{1:'<b>expected</b>  …\n<b>got</b>       <u>…</u>'}, tests:4 }

/* ── three.js path ───────────────────────────────────────── */
const canvas = $('scene')
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true })
renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
renderer.setClearColor(0x101028)
const scene = new THREE.Scene()
scene.fog = new THREE.FogExp2(0x101028, 0.02)
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200)
const GAP = 30, COL = { amber:0xffb561, aqua:0x7df0df, lav:0xb9a5ff, todo:0x4d4b86 }

function glowTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 128
  const g = c.getContext('2d'), grad = g.createRadialGradient(64,64,0,64,64,64)
  grad.addColorStop(0,'rgba(255,255,255,.9)'); grad.addColorStop(.25,'rgba(255,255,255,.35)'); grad.addColorStop(1,'rgba(255,255,255,0)')
  g.fillStyle = grad; g.fillRect(0,0,128,128)
  return new THREE.CanvasTexture(c)
}
const glowTex = glowTexture()

function layout(kind, n){
  const pts = []
  if (kind==='row') for (let i=0;i<n;i++) pts.push([ (i-(n-1)/2)*1.35, Math.sin(i*.8)*.7, 0 ])
  if (kind==='stairs') for (let i=0;i<n;i++) pts.push([ (i-(n-1)/2)*1.4, (i-(n-1)/2)*.62, 0 ])
  if (kind==='tree') for (let i=0;i<n;i++){ const lvl=Math.floor(Math.log2(i+1)), k=i-(2**lvl-1), w=2**lvl; pts.push([ (k-(w-1)/2)*(11/w), 3-lvl*2, 0 ]) }
  if (kind==='grid') for (let i=0;i<n;i++){ const r=Math.floor(i/6), c=i%6, cc=r%2?5-c:c; pts.push([ (cc-2.5)*1.7, 2.6-r*1.7, 0 ]) }
  if (kind==='graph') for (let i=0;i<n;i++){ const inner=i%3===2, a=i/n*Math.PI*2-Math.PI/2, rad=inner?2.3:4.6; pts.push([ Math.cos(a)*rad*1.35, Math.sin(a)*rad*.92, inner?1.2:0 ]) }
  return pts
}

const nodes = [], edges = [], pick = []
const sphere = new THREE.SphereGeometry(.26, 24, 24), hit = new THREE.SphereGeometry(.7, 8, 8)
STAGES.forEach((st, s) => {
  const pts = layout(st.layout, st.lessons.length)
  st.nodes = st.lessons.map(([title, kind], i) => {
    const order = nodes.length
    const n = { id:`${s+1}.${i+1}`, s, i, order, title, kind, base:new THREE.Vector3(pts[i][0]+s*GAP, pts[i][1], pts[i][2]), phase:Math.random()*6.28 }
    n.done = order < DONE; n.redo = REDO.includes(n.id)
    n.group = new THREE.Group(); n.group.position.copy(n.base)
    n.mesh = new THREE.Mesh(sphere, new THREE.MeshBasicMaterial({ color:COL.todo }))
    n.glow = new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTex, blending:THREE.AdditiveBlending, depthWrite:false, transparent:true }))
    const h = new THREE.Mesh(hit, new THREE.MeshBasicMaterial({ transparent:true, opacity:0, depthWrite:false })); h.userData.node = n; pick.push(h)
    n.group.add(n.mesh, n.glow, h)
    if (n.redo){ n.ring = new THREE.Mesh(new THREE.TorusGeometry(.52,.025,8,48), new THREE.MeshBasicMaterial({ color:COL.lav })); n.group.add(n.ring) }
    scene.add(n.group); nodes.push(n); return n
  })
  const link = (a,b) => { const g = new THREE.BufferGeometry().setFromPoints([a.base,b.base]); const l = new THREE.Line(g, new THREE.LineBasicMaterial({ transparent:true })); l.userData={a,b}; scene.add(l); edges.push(l) }
  if (st.layout==='tree') st.nodes.forEach((n,i)=>{ if(i) link(st.nodes[(i-1)>>1], n) })
  else { st.nodes.forEach((n,i)=>{ if(i) link(st.nodes[i-1], n) }); if (st.layout==='graph') st.nodes.forEach((n,i)=>{ if(i%3===2) link(n, st.nodes[(i+5)%st.nodes.length]) }) }
  if (s) link(STAGES[s-1].nodes[STAGES[s-1].nodes.length-1], st.nodes[0])
})
const nextNode = () => nodes.find(n => !n.done)

function paint(){
  const nx = nextNode()
  nodes.forEach(n => {
    const c = n.done ? COL.amber : n===nx ? COL.aqua : COL.todo
    n.mesh.material.color.setHex(c)
    n.glow.material.color.setHex(c)
    n.glow.material.opacity = n.done ? .55 : n===nx ? .95 : 0
    n.glow.scale.setScalar(n.done ? 2.2 : 3.4)
    n.isNext = n===nx
  })
  edges.forEach(l => { const lit = l.userData.a.done && l.userData.b.done; l.material.color.setHex(lit ? COL.amber : 0x5a58a0); l.material.opacity = lit ? .6 : .28 })
  const done = nodes.filter(n=>n.done).length, C = 2*Math.PI*19
  $('ringFg').style.strokeDasharray = C; $('ringFg').style.strokeDashoffset = C*(1-done/nodes.length); $('ringTxt').textContent = done
}

// drifting dust for depth
{ const N=1100, pos=new Float32Array(N*3)
  for(let i=0;i<N;i++){ pos[i*3]=-25+Math.random()*(GAP*4+50); pos[i*3+1]=(Math.random()-.5)*30; pos[i*3+2]=-34+Math.random()*38 }
  const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos,3))
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color:0x9b97e0, size:.07, transparent:true, opacity:.55, depthWrite:false }))) }

const bursts = []
function burst(at){
  const N=140, pos=new Float32Array(N*3), vel=[]
  for(let i=0;i<N;i++){ pos.set([at.x,at.y,at.z], i*3); const v=new THREE.Vector3().randomDirection().multiplyScalar(2+Math.random()*5); vel.push(v) }
  const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos,3))
  const p=new THREE.Points(g, new THREE.PointsMaterial({ color:COL.amber, size:.16, map:glowTex, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false }))
  scene.add(p); bursts.push({ p, vel, t:0 })
}

/* ── camera + interaction ────────────────────────────────── */
let stage = 1, selected = null, hovered = null, focusNode = null
const mouse = { x:0, y:0 }, cam = { x:GAP, y:.4, z:17 }
camera.position.set(GAP, .4, 26)
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2()

function resize(){ renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); slidePills() }
addEventListener('resize', resize)

function hitTest(e){ ndc.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(ndc, camera); const h = ray.intersectObjects(pick)[0]; return h ? h.object.userData.node : null }
canvas.addEventListener('pointermove', e => {
  mouse.x = e.clientX/innerWidth-.5; mouse.y = e.clientY/innerHeight-.5
  if (focusNode) return
  hovered = hitTest(e); canvas.style.cursor = hovered ? 'pointer' : ''
  const tip = $('tip'); tip.classList.toggle('on', !!hovered && hovered!==selected)
  if (hovered){ tip.textContent = hovered.title; tip.style.transform = `translate(${e.clientX+14}px,${e.clientY-34}px)` }
})
canvas.addEventListener('click', e => { if (!focusNode) select(hitTest(e)) })

function select(n){
  selected = n; $('tip').classList.remove('on')
  $('card').classList.toggle('on', !!n)
  if (!n) return
  if (n.s !== stage) goStage(n.s)
  $('cardKind').textContent = n.redo ? 'Write it again from scratch' : n.done ? 'Finished' : KIND[n.kind]
  $('cardTitle').textContent = n.title
  $('cardGo').textContent = n.redo ? 'Write it again' : n.done ? 'Open' : 'Start coding'
}

function goStage(s){
  if (s === stage) return
  stage = s; if (selected && selected.s !== s) select(null)
  const sw = $('stageSwap'); sw.classList.add('out')
  setTimeout(() => { stageText(); sw.classList.remove('out') }, 260)
  document.querySelectorAll('#dock button').forEach((b,i)=>b.classList.toggle('on', i===s)); slidePills()
}
function stageText(){ const st = STAGES[stage], d = st.nodes.filter(n=>n.done).length
  $('stageName').textContent = st.name
  $('stageSub').textContent = d===st.nodes.length ? 'All done' : d ? `${d} of ${st.nodes.length} done` : `${st.nodes.length} lessons` }

STAGES.forEach((st,i) => { const b = document.createElement('button'); b.textContent = st.short; b.className = i===stage?'on':''; b.onclick = () => goStage(i); $('dock').appendChild(b) })
function slidePills(){ document.querySelectorAll('.seg,.dock,.tabs').forEach(w => { const on = w.querySelector('button.on'), p = w.querySelector('.pill'); if(on&&p){ p.style.width = on.offsetWidth+'px'; p.style.transform = `translateX(${on.offsetLeft}px)` } }) }
$('mode').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; $('mode').querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b)); slidePills() })
addEventListener('keydown', e => { if (focusNode){ if(e.key==='Escape') leave(); return }
  if (e.key==='ArrowRight') goStage(Math.min(STAGES.length-1, stage+1)); if (e.key==='ArrowLeft') goStage(Math.max(0, stage-1)) })
let wheelLock = 0
addEventListener('wheel', e => { if (focusNode || Date.now() < wheelLock) return; const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY
  if (Math.abs(d) < 30) return; wheelLock = Date.now()+650; goStage(Math.max(0, Math.min(STAGES.length-1, stage + Math.sign(d)))) }, { passive:true })
$('redoChip').onclick = () => select(nodes.find(n => n.id==='2.3'))

/* ── lesson view ─────────────────────────────────────────── */
const hl = src => src.replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/("(?:[^"\\]|\\.)*")/g,'<span class="s">$1</span>')
  .replace(/\b(int|long|void|bool|return|while|for|if|else|struct|using|namespace|const|auto)\b(?![^<]*<\/span>)/g,'<span class="k">$1</span>')
  .replace(/\b(vector|string|cin|cout|Task)\b(?![^<]*<\/span>)/g,'<span class="t">$1</span>')
  .replace(/#include/g,'<span class="k">#include</span>')
let L = null, attempts = 0, tab = 'refresher', hintsShown = 1
function drawCode(src){ $('code').innerHTML = src.split('\n').map((l,i)=>`<div class="ln"><span>${i+1}</span><span>${hl(l).replace('▮','<span class="caret"></span>')}</span></div>`).join('') }
function drawTab(){
  const el = $('tabBody'); el.classList.add('out')
  setTimeout(() => {
    if (tab==='refresher') el.innerHTML = L.refresher
    if (tab==='hints') el.innerHTML = L.hints.slice(0,hintsShown).map(h=>`<p>${h}</p>`).join('') + (hintsShown<L.hints.length ? '<button class="reveal" id="more">Show another hint</button>' : '')
    if (tab==='answer') el.innerHTML = `<div class="locked"><div class="tries">${[0,1,2].map(i=>`<i class="${i<attempts?'used':''}"></i>`).join('')}</div><span>Opens when you pass, or after three misses.</span></div>`
    const m = $('more'); if (m) m.onclick = () => { hintsShown++; drawTab() }
    el.classList.remove('out')
  }, 180)
}
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; tab = b.dataset.t
  $('tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b)); slidePills(); drawTab() })

function enter(n){
  focusNode = n; L = SAMPLES[n.id] || GENERIC; attempts = 0; tab = 'refresher'; hintsShown = 1
  $('lTitle').textContent = n.title; $('lKind').textContent = n.redo ? 'Write it again from scratch' : KIND[n.kind]
  $('lTask').innerHTML = L.task + (L.eg ? `<div class="eg">${L.eg}</div>` : '')
  $('tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on', x.dataset.t==='refresher'))
  drawCode(L.code); drawTab(); clearResults()
  document.body.classList.add('focus'); setTimeout(slidePills, 30)
}
function leave(){ document.body.classList.remove('focus'); focusNode = null }
$('cardGo').onclick = () => selected && enter(selected)
$('back').onclick = leave

function clearResults(){ $('dots').innerHTML=''; $('verdict').className='verdict'; $('verdict').textContent=''; $('detail').classList.remove('on') }
$('check').onclick = () => {
  const btn = $('check'); if (btn.classList.contains('busy')) return
  clearResults(); btn.classList.add('busy'); btn.textContent = 'Checking…'
  const win = attempts >= 1 || !L.fixed && attempts >= 1
  if (win && L.fixed) drawCode(L.code.replace('    ▮', L.fixed))
  setTimeout(() => {
    btn.classList.remove('busy'); btn.textContent = 'Check my code'
    let passed = 0
    for (let i=0;i<L.tests;i++){
      const fail = !win && L.fails[i]; if(!fail) passed++
      const d = document.createElement('button'); d.className = 'dot ' + (fail?'fail':'pass'); d.setAttribute('aria-label', `Test ${i+1} ${fail?'failed':'passed'}`)
      if (fail) d.onclick = () => { const open = d.classList.contains('open'); document.querySelectorAll('.dot').forEach(x=>x.classList.remove('open'))
        $('detail').classList.toggle('on', !open); if(!open){ d.classList.add('open'); $('detail').innerHTML = fail } }
      $('dots').appendChild(d); setTimeout(()=>d.classList.add('in'), 70*i+20)
    }
    const v = $('verdict')
    setTimeout(() => { v.textContent = win ? 'All passed' : `${passed} of ${L.tests} passed. Tap a red dot.`; v.className = 'verdict in' + (win?' win':'') }, 70*L.tests+120)
    if (!win){ attempts++; if (tab==='answer') drawTab() }
    else setTimeout(() => celebrate(focusNode), 1300)
  }, 700)
}
function celebrate(n){
  leave(); select(null)
  setTimeout(() => { n.done = true; n.redo = false; if(n.ring){ n.group.remove(n.ring); n.ring=null } paint(); stageText(); burst(n.base); n.pop = 1
    setTimeout(() => select(nextNode()), 1100) }, 520)
}

/* ── loop ────────────────────────────────────────────────── */
const clock = new THREE.Clock()
function frame(){
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime
  const f = focusNode, tx = f ? f.base.x - 2.2 : stage*GAP, ty = f ? f.base.y : .4, tz = f ? 7 : 17
  const k = 1 - Math.pow(.0018, dt)
  cam.x += (tx-cam.x)*k; cam.y += (ty-cam.y)*k; cam.z += (tz-cam.z)*k
  const px = f||reduce ? 0 : mouse.x, py = f||reduce ? 0 : mouse.y
  camera.position.set(cam.x + px*1.6, cam.y - py*1.1, cam.z)
  camera.lookAt(cam.x, cam.y, 0)
  nodes.forEach(n => {
    if (!reduce && !f) n.group.position.y = n.base.y + Math.sin(t*.9 + n.phase)*.08
    let sc = n===selected||n===hovered ? 1.45 : 1
    if (n.isNext && !reduce) sc *= 1 + Math.sin(t*2.6)*.14
    if (n.pop){ n.pop = Math.max(0, n.pop - dt*1.4); sc *= 1 + n.pop*1.6 }
    n.mesh.scale.setScalar(n.mesh.scale.x + (sc - n.mesh.scale.x)*.18)
    if (n.ring){ n.ring.rotation.x = t*.9; n.ring.rotation.y = t*.6 }
  })
  for (let i=bursts.length-1;i>=0;i--){ const b=bursts[i]; b.t += dt; const a=b.p.geometry.attributes.position
    b.vel.forEach((v,j)=>{ a.array[j*3]+=v.x*dt; a.array[j*3+1]+=v.y*dt; a.array[j*3+2]+=v.z*dt; v.multiplyScalar(.965) }); a.needsUpdate=true
    b.p.material.opacity = Math.max(0, 1-b.t/1.5); if (b.t>1.5){ scene.remove(b.p); bursts.splice(i,1) } }
  renderer.render(scene, camera)
  requestAnimationFrame(frame)
}
paint(); stageText(); resize(); frame()
document.fonts && document.fonts.ready.then(slidePills)
setTimeout(() => select(nextNode()), 900)
</script>
</body>
</html>
