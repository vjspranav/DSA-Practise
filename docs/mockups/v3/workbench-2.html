<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workbench 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&family=JetBrains+Mono:wght@400;500&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
:root{--font:'Roboto Flex',Roboto,system-ui,sans-serif;--r:18px;
  --bg:#eef3f1;--card:#fff;--card2:#e8f0ed;--text:#16201d;--sub:#566660;--line:#d9e3df;
  --pri:#00695c;--on-pri:#fff;--pri-c:#cdeee6;--on-pri-c:#003d35;--pri-shadow:rgba(0,105,92,.35);
  --ok:#1b7f3b;--ok-c:#d8f3df;--bad:#b3261e;--bad-c:#fde2df;--inverse:#263330;--on-inverse:#fff;
  --elev:0 1px 3px rgba(22,32,29,.08),0 1px 2px rgba(22,32,29,.05);--float:0 4px 10px rgba(22,32,29,.1),0 14px 34px rgba(22,32,29,.16);
  --ed-bg:#fff;--ed-text:#1d2a27;--ed-num:#a9b8b3;--ed-cur:#f1f7f5;--ed-new:rgba(0,105,92,.07);--ed-flash:rgba(0,105,92,.28);--c-k:#7b3fc4;--c-t:#00695c;--c-s:#b25a00}
html[data-theme=dark]{--bg:#0f1514;--card:#19211f;--card2:#232d2a;--text:#e0ebe7;--sub:#9bb0a9;--line:#2c3835;
  --pri:#7fd8c6;--on-pri:#00382f;--pri-c:#0d4f45;--on-pri-c:#cdeee6;--pri-shadow:rgba(0,0,0,.5);
  --ok:#86d99a;--ok-c:#143a20;--bad:#ffb4ab;--bad-c:#55150f;--inverse:#e0ebe7;--on-inverse:#16201d;
  --elev:0 1px 3px rgba(0,0,0,.5);--float:0 6px 16px rgba(0,0,0,.5),0 16px 40px rgba(0,0,0,.4);
  --ed-bg:#141b19;--ed-text:#dbe7e3;--ed-num:#4c5c57;--ed-cur:#1b2422;--ed-new:rgba(127,216,198,.08);--ed-flash:rgba(127,216,198,.35);--c-k:#cfa8ff;--c-t:#7fd8c6;--c-s:#ffc078}
html,body{height:100%}
body{display:grid;grid-template-columns:304px 1fr;overflow:hidden;transition:grid-template-columns .5s var(--ease)}
body.min{grid-template-columns:76px 1fr}

/* drawer */
.drawer{display:flex;flex-direction:column;min-height:0;min-width:0;padding:14px 12px 12px;overflow:hidden}
.brand{display:flex;align-items:center;gap:6px;padding:0 4px 12px;font-weight:700;font-size:18px;white-space:nowrap}
.brand b{flex:1;padding-left:6px}
.overall{padding:0 12px 14px;font-size:13px;color:var(--sub);display:grid;gap:8px;white-space:nowrap}
.nav{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;padding-right:4px}
.grp-h{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;width:100%;height:46px;padding:0 12px;border-radius:23px;font-weight:600;font-size:14px;white-space:nowrap}
.grp-h:hover{background:var(--card2)}
.grp-h .art{width:28px;height:18px;color:var(--pri);flex-shrink:0}
.grp-h .art.ic{display:grid;place-items:center}
.grp-h .n{flex:1;overflow:hidden;text-overflow:ellipsis}
.grp-h small{color:var(--sub);font-weight:500;font-size:12.5px}
.grp-h .chev{color:var(--sub);transition:transform .4s var(--ease)}
.grp.open .chev{transform:rotate(180deg)}
.item{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 14px 0 16px;border-radius:20px;font-size:14px;color:var(--sub);white-space:nowrap;transition:background .2s,color .2s}
.item:hover{background:var(--card2)}
.item .ms{font-size:18px;color:var(--line)}
.item.done .ms{color:var(--ok)}
.item .ttl{flex:1;overflow:hidden;text-overflow:ellipsis}
.item.on{background:var(--pri-c);color:var(--on-pri-c);font-weight:600;view-transition-name:active-item}
.item.on .ms{color:var(--pri)}
.item .again{font-size:16px;color:var(--pri)}
.item.justdone .ms{animation:tick .7s var(--ease)}
@keyframes tick{0%{transform:scale(0) rotate(-90deg)}60%{transform:scale(1.5)}}
body.min .brand b,body.min .brand .theme,body.min .overall,body.min .grp-h .n,body.min .grp-h small,body.min .chev{display:none}
body.min .fold{grid-template-rows:0fr!important}
body.min .grp-h{padding:0 12px;justify-content:center}

/* main */
.main{display:flex;min-width:0;min-height:0;padding:12px 12px 12px 0;gap:12px}
.work{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;min-height:0}
.task{display:flex;align-items:center;gap:18px;padding:16px 16px 16px 24px}
.task .txt{flex:1;min-width:0}
.task h2{font-size:22px;font-weight:700;letter-spacing:-.01em;view-transition-name:lesson-title;width:fit-content}
.task p{color:var(--sub);font-size:14.5px;margin-top:2px}
.task .kd{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--on-pri-c);background:var(--pri-c);padding:5px 11px 5px 8px;border-radius:9px;white-space:nowrap}
.task .kd .ms{font-size:16px}
.editor{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.ed-h{display:flex;align-items:center;gap:8px;padding:8px 10px 0 12px}
.filetab{display:flex;align-items:center;gap:8px;height:40px;padding:0 16px 0 12px;border-radius:12px 12px 0 0;background:var(--ed-bg);font-family:var(--mono);font-size:13px;box-shadow:inset 0 2px 0 var(--pri);align-self:flex-end}
.filetab i{width:8px;height:8px;border-radius:50%;background:var(--pri)}
.ed-h .sp{flex:1}
.ed-h .btn{margin-bottom:8px}
kbd{font-family:var(--font);font-size:11.5px;font-weight:500;opacity:.75;margin-left:2px}
.ed-h-wrap{background:var(--card2)}
.busyline{height:3px;background:var(--line);overflow:hidden;opacity:0;transition:opacity .2s}
.busyline.on{opacity:1}
.busyline i{display:block;height:100%;width:40%;background:var(--pri);border-radius:2px;animation:slide 1s var(--ease) infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.code-wrap{flex:1;min-height:0;position:relative;display:flex}
.editor .codeview{flex:1;min-height:0;padding-bottom:80px}
.ln.cur{background:var(--ed-cur)}
.ln.cur>span:first-child{color:var(--ed-text)}
.status{display:flex;gap:16px;padding:6px 20px;font-size:12px;color:var(--sub);border-top:1px solid var(--line)}
.status .sp{flex:1}
.nudge{position:absolute;right:18px;bottom:18px;z-index:2;display:flex;align-items:center;gap:12px;padding:12px 8px 12px 16px;border-radius:18px;background:var(--card);box-shadow:var(--float);font-size:14.5px;font-weight:500;transform:translateY(24px) scale(.94);opacity:0;pointer-events:none;transition:transform .55s var(--ease),opacity .3s}
.nudge.on{transform:none;opacity:1;pointer-events:auto}
.nudge .bulb{width:36px;height:36px;border-radius:50%;background:var(--pri-c);color:var(--on-pri-c);display:grid;place-items:center}
.nudge.on .bulb{animation:tick .8s var(--ease) .2s backwards}
.res{border-top:1px solid var(--line);padding:0 20px}
.res .pad{padding:14px 0 16px;display:flex;gap:16px;align-items:flex-start}

/* help */
.rail{display:flex;flex-direction:column;gap:6px;padding:8px 2px;align-self:flex-start}
.rail button{position:relative;overflow:hidden;width:68px;padding:8px 0 6px;border-radius:16px;display:grid;justify-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--sub);transition:color .25s}
.rail button .ms{font-size:22px;padding:4px 18px;border-radius:14px;transition:background .3s,color .3s}
.rail button.on{color:var(--on-pri-c)}
.rail button.on .ms{background:var(--pri-c)}
.rail button:hover .ms{background:var(--card2)}
.rail button.unlocked .ms{color:var(--ok);animation:tick .8s var(--ease)}
.rail .badge{position:absolute;top:8px;right:14px;width:9px;height:9px;border-radius:50%;background:var(--bad);animation:chip .4s var(--ease)}
.side{width:0;opacity:0;overflow:hidden;transition:width .5s var(--ease),opacity .3s}
.side.open{width:340px;opacity:1}
.side-in{width:340px;height:100%;display:flex;flex-direction:column}
.side-h{display:flex;align-items:center;padding:12px 8px 8px 20px;font-weight:700;font-size:16px}
.side-h span{flex:1}
.side-b{padding:8px 20px 20px;overflow-y:auto;view-transition-name:side-body}
@media (max-width:900px){body,body.min{grid-template-columns:1fr;overflow:auto;height:auto}.drawer{max-height:44vh}.main{padding:12px;flex-direction:column}.side.open,.side-in{width:100%}.rail{flex-direction:row}.editor{min-height:520px}}
</style>
</head>
<body>
<aside class="drawer" id="drawer"></aside>
<div class="main" id="main"></div>
<div class="snack" id="snack"></div>
<script src="shared.js"></script>
<script>
let V = { lesson: nextLesson(), open: { [nextLesson().s]: true }, tab: null, st: newState(), res: null, nudge: false, justDone: null, justUnlocked: false }
const widths = {}   // remember bar widths so they glide to the new value after a re-render

function bar(key, pct) { const from = widths[key] ?? pct; widths[key] = pct; return `<div class="bar-track"><i style="width:${from}%" data-w="${pct}"></i></div>` }
function drawer() {
  const item = (l, inAgain) => `<button class="item rip${l.done ? ' done' : ''}${!inAgain && l === V.lesson ? ' on' : ''}${!inAgain && l === V.justDone ? ' justdone' : ''}" data-act="lesson" data-id="${l.id}">
    <span class="ms${l.done ? ' fill' : ''}">${inAgain ? 'replay' : l.done ? 'check_circle' : 'circle'}</span><span class="ttl">${l.title}</span>${!inAgain && l.redo ? '<span class="ms again" title="Ready to write again">replay</span>' : ''}</button>`
  const grp = (key, art, name, count, items) => `<div class="grp${V.open[key] ? ' open' : ''}">
    <button class="grp-h rip" data-act="grp" data-s="${key}" title="${name}">${art}<span class="n">${name}</span><small>${count}</small><span class="ms chev">expand_more</span></button>
    <div class="fold${V.open[key] ? ' open' : ''}"><div>${items}</div></div></div>`
  const again = redoList()
  $('drawer').innerHTML = `<div class="brand"><button class="iconbtn" data-act="min" aria-label="Collapse or expand the lesson list"><span class="ms">menu</span></button><b>Foundations</b>${THEME_BTN}</div>
    <div class="overall"><span>${totalDone()} of ${ALL.length} lessons done</span>${bar('all', totalDone() / ALL.length * 100)}</div>
    <nav class="nav">
      ${again.length ? grp('again', '<span class="art ic"><span class="ms">replay</span></span>', 'Write again', again.length, again.map(l => item(l, true)).join('')) : ''}
      ${STAGES.map(s => grp(s.i, `<span class="art">${ART[s.i]}</span>`, s.name, `${stageDone(s)}/${s.lessons.length}`, s.lessons.map(l => item(l)).join(''))).join('')}
    </nav>`
  requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll('.bar-track i[data-w]').forEach(i => i.style.width = i.dataset.w + '%')))
}
const TABS = [['refresher', 'menu_book', 'Refresher'], ['hints', 'lightbulb', 'Hints'], ['answer', 'lock', 'Answer']]
function main() {
  const l = V.lesson, L = content(l), nx = lessonAfter(l), tabName = V.tab && TABS.find(t => t[0] === V.tab)[2], unlocked = answerOpen(V.st)
  $('main').innerHTML = `<div class="work">
      <section class="card task"><div class="txt"><h2>${l.title}</h2><p>${L.task}</p></div><span class="kd"><span class="ms">${l.redo ? 'replay' : KIND_ICON[l.kind]}</span>${l.redo ? 'Write it again from scratch' : KIND[l.kind]}</span></section>
      <section class="card editor">
        <div class="ed-h-wrap"><div class="ed-h"><span class="filetab"><i></i>solution.cpp</span><span class="sp"></span>
          <button class="btn text"><span class="ms fill">play_arrow</span>Run</button>
          <button class="btn fill" data-act="check" id="check" title="Ctrl or Cmd + Enter">Check my code<kbd>⌘↵</kbd></button></div></div>
        <div class="busyline" id="busy"><i></i></div>
        <div class="code-wrap"><div class="codeview" id="code">${codeHTML(L, V.st.passed)}</div>
          <div class="nudge${V.nudge ? ' on' : ''}" id="nudge"><span class="bulb"><span class="ms">${unlocked ? 'lock_open' : 'lightbulb'}</span></span><span>${unlocked ? 'Three misses. The answer is open.' : 'Stuck? A hint is ready.'}</span>
            <button class="btn text" data-act="tab" data-t="${unlocked ? 'answer' : 'hints'}">Show me</button><button class="iconbtn" data-act="nonudge" aria-label="Dismiss"><span class="ms">close</span></button></div></div>
        <div class="fold${V.res ? ' open' : ''}"><div><div class="res"><div class="pad"><div style="flex:1;min-width:0">${resultsHTML(V.res)}</div>
          ${V.st.passed && nx ? `<button class="btn tone" data-act="lesson" data-id="${nx.id}" style="animation:pop .5s var(--ease) .5s backwards">Next: ${nx.title}<span class="ms" style="margin:0 -6px 0 0">arrow_forward</span></button>` : ''}</div></div></div></div>
        <div class="status"><span>Ln 8, Col 5</span><span class="sp"></span><span>Autocomplete off</span><span>C++17</span></div>
      </section>
    </div>
    <div class="card side${V.tab ? ' open' : ''}"><div class="side-in"><div class="side-h"><span>${tabName || ''}</span><button class="iconbtn" data-act="tab" data-t="${V.tab}" aria-label="Close"><span class="ms">close</span></button></div>
      <div class="side-b">${V.tab ? helpHTML(L, V.tab, V.st) : ''}</div></div></div>
    <div class="rail">${TABS.map(([t, ic, nm]) => `<button class="rip${V.tab === t ? ' on' : ''}${t === 'answer' && V.justUnlocked ? ' unlocked' : ''}" data-act="tab" data-t="${t}"><span class="ms">${t === 'answer' && unlocked ? 'lock_open' : ic}</span>${nm}${t === 'hints' && V.nudge && !unlocked ? '<i class="badge"></i>' : ''}</button>`).join('')}</div>`
  const caret = document.querySelector('#code .caret'); if (caret) caret.closest('.ln').classList.add('cur')
  V.justUnlocked = false
}
function render() { drawer(); main(); V.justDone = null }

function pick(id) { const l = byId(id); V = { ...V, lesson: l, tab: null, st: newState(), res: null, nudge: false }; V.open[l.s] = true; vt(render) }
function openSide() { main(); const s = document.querySelector('.side'); s.classList.remove("open"); void s.offsetWidth; setTimeout(() => s.classList.add("open"), 30) }
function check() {
  const btn = $('check'); if (btn.classList.contains('busy')) return
  btn.classList.add('busy'); $('busy').classList.add('on'); $('nudge').classList.remove('on')
  setTimeout(() => {
    const hadSide = !!V.tab
    V.res = simulate(content(V.lesson), V.st)
    if (V.res.win) { V.lesson.done = true; V.lesson.redo = false; V.justDone = V.lesson; V.justUnlocked = true; V.nudge = false; V.tab = 'answer'
      snack('<span class="ms fill">check_circle</span>Passed. The answer is unlocked.'); drawer(); hadSide ? main() : openSide(); V.justDone = null }
    else { V.nudge = V.tab !== 'hints'; if (V.st.attempts === 3) V.justUnlocked = true; main(); if (V.nudge) { $('nudge').classList.remove('on'); setTimeout(() => $('nudge').classList.add('on'), 700) } }
  }, 800)
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return
  const act = el.dataset.act
  if (act === 'theme') toggleTheme()
  if (act === 'min') document.body.classList.toggle('min')
  if (act === 'grp') {
    const s = el.dataset.s
    if (document.body.classList.contains('min')) { document.body.classList.remove('min'); V.open[s] = true; drawer(); return }
    V.open[s] = !V.open[s]; el.parentElement.classList.toggle('open', V.open[s]); el.nextElementSibling.classList.toggle('open', V.open[s])
  }
  if (act === 'lesson') pick(el.dataset.id)
  if (act === 'tab') {
    const t = el.dataset.t, was = V.tab
    V.tab = was === t ? null : t; V.st.lastHint = 0; if (V.tab === 'hints' || V.tab === 'answer') V.nudge = false
    if (was && V.tab) vt(main)
    else if (V.tab) openSide()
    else { document.querySelector('.side').classList.remove('open'); setTimeout(main, 450) }
  }
  if (act === 'hint') { V.st.lastHint = V.st.hints; V.st.hints++; vt(main) }
  if (act === 'nonudge') { V.nudge = false; $('nudge').classList.remove('on') }
  if (act === 'test') toggleDetail(V.res, +el.dataset.i, el)
  if (act === 'check') check()
})
addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') check() })
render()
if (location.hash.includes('demo')) setTimeout(() => { check(); if (location.hash.includes('demo2')) setTimeout(check, 1200) }, 300)
if (location.hash.includes('min')) document.body.classList.add('min')
</script>
</body>
</html>
